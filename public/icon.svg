<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#070B14" />
      <stop offset="100%" stop-color="#1E1035" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="50%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <!-- Waveform / Musical Note Iconography -->
  <g filter="url(#glow)" transform="translate(106, 126)">
    <!-- Central Sound Waves / Sparks -->
    <rect x="20" y="90" width="16" height="80" rx="8" fill="url(#waveGrad)" opacity="0.6" />
    <rect x="56" y="60" width="16" height="140" rx="8" fill="url(#waveGrad)" opacity="0.8" />
    <rect x="92" y="30" width="16" height="200" rx="8" fill="url(#waveGrad)" />
    <rect x="128" y="70" width="16" height="120" rx="8" fill="url(#waveGrad)" opacity="0.9" />
    <rect x="164" y="10" width="16" height="240" rx="8" fill="url(#waveGrad)" />
    <rect x="200" y="45" width="16" height="170" rx="8" fill="url(#waveGrad)" opacity="0.85" />
    <rect x="236" y="80" width="16" height="100" rx="8" fill="url(#waveGrad)" opacity="0.7" />
    <rect x="272" y="105" width="16" height="50" rx="8" fill="url(#waveGrad)" opacity="0.5" />
  </g>
</svg>
